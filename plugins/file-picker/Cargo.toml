[package]
name = "istmo-file-picker"
version = "0.1.1-alpha.5"
description = "Cross-platform file-picker plugin for the istmo framework — SAF on Android, UIDocumentPicker on iOS, NSOpenPanel on macOS, IFileOpenDialog on Windows, XDG portal on Linux."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
include = ["/src", "/build.rs", "/istmo.toml", "/native", "/README.md", "/LICENSE*"]
keywords = ["istmo", "file-picker", "saf", "document-picker", "mobile"]
categories = ["filesystem", "api-bindings"]
links = "istmo_file_picker"

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }

# Reference desktop backend (Rust-hosted): rfd wraps the native pickers.
# Windows/macOS use native APIs synchronously; Linux uses the XDG
# Desktop Portal, which rfd drives via an internal pollster executor
# (no external async runtime required).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.17", default-features = false }

# Linux: skip rfd's `wayland` default feature (which pulls wayland-sys +
# pkg-config); the XDG portal works on both X11 and Wayland through the
# session DBus service, no direct Wayland link needed.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
flume = { workspace = true }
pollster = { workspace = true }

# Copy of `[workspace.lints]` except that `unsafe_code` is `deny`
# instead of `forbid`: adopting the native fd / HANDLE in `fd_bridge`
# needs `unsafe`, and `forbid` cannot be lifted by an inner `#[expect]`,
# while `deny` still keeps every other module unsafe-free. The one
# addition, `undocumented_unsafe_blocks`, holds those blocks to a
# SAFETY comment. Keep the rest in sync with the workspace table.
[lints.rust]
# Toolchains older than clippy 1.100 do not know `unused_async_trait_impl`.
unknown_lints = { level = "allow", priority = -2 }
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "warn"
# Plugin traits are async; sync backends implement them with `async fn`
# rather than hand-built `std::future::ready` futures.
unused_async_trait_impl = "allow"
