[package]
name = "istmo-launcher-actions"
version = "0.1.1-alpha.7"
description = "The app icon for the istmo framework: launcher shortcuts and quick actions, Jump List tasks, the Dock menu, badges, progress, attention and recent documents. Actions come back as deep links."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
include = ["/src", "/build.rs", "/istmo.toml", "/native", "/README.md", "/LICENSE*"]
keywords = ["istmo", "shortcuts", "jump-list", "dock", "badge"]
categories = ["gui", "api-bindings"]
links = "istmo_launcher_actions"

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
tracing = { workspace = true }

# LauncherEntry on the session bus. The async API: an update is one
# signal on a kept connection, awaited without a blocking worker.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }

# Jump List tasks, taskbar progress, FlashWindowEx and the shell's recent
# documents, on one COM thread.
[target.'cfg(target_os = "windows")'.dependencies]
istmo-window = { workspace = true }
flume = { workspace = true }
oneshot = { workspace = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Dock tile, Dock menu, attention and recent documents. Dock menu items
# publish deep links straight on the runtime.
[target.'cfg(target_os = "macos")'.dependencies]
istmo-plugins = { workspace = true }
oneshot = { workspace = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSDocumentController", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
istmo-build = { workspace = true }
istmo-plugins = { workspace = true }
pollster = { workspace = true }

# The LauncherEntry test watches the bus with the blocking API.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints.rust]
# Toolchains older than clippy 1.100 do not know `unused_async_trait_impl`.
unknown_lints = { level = "allow", priority = -2 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
# Only the Windows (COM) and macOS (objc2) modules allow it.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
redundant_pub_crate = "allow"
undocumented_unsafe_blocks = "deny"
# Plugin traits are async; sync backends implement them with `async fn`
# rather than hand-built `std::future::ready` futures.
unused_async_trait_impl = "allow"
