android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Coordinates published to Maven Central via the Sonatype Central
# Portal (https://central.sonatype.com/artifact/io.github.sergioribera/istmo-gradle-plugin).
# Shares the release version of the crates, the Swift package tag and
# `runtimeVersion` in `runtime/android/gradle.properties`: cargo-release
# rewrites it (`pre-release-replacements` in the root `Cargo.toml`), the
# `publish-runtime` workflow sets it from its input, and
# `crates/build/tests/release_versions.rs` fails when it drifts.
pluginGroup=io.github.sergioribera
pluginArtifact=istmo-gradle-plugin
pluginVersion=0.1.1-alpha.5
