[package]
name = "rust-mobile-demo"
version = "0.0.0"
description = "Full-Rust mobile demo — egui UI driving google_sign_in + notifications + permissions plugins."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
istmo = { path = "../.." }
istmo-plugins = { workspace = true }
log = "0.4"
pollster = { workspace = true }
bincode = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"
