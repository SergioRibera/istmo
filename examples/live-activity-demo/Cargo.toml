[package]
name = "live-activity-demo"
version = "0.0.0"
description = "Multi-platform istmo demo — same Rust code drives desktop, Android, and iOS clients of the live-activity plugin."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `cdylib` for android (`.so` loaded by the Kotlin runtime), `staticlib`
# for iOS family (linked into the app executable). Both artefacts fall out
# of the same source tree.
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
# Desktop entrypoint. Trivial `fn main() {}` stub on mobile targets — the
# cdylib/staticlib carries the real entry via `#[istmo::mobile_app]`.
name = "live-activity-demo"
path = "src/main.rs"

[dependencies]
istmo = { path = "../.." }
istmo-core = { workspace = true }
istmo-live-activity = { workspace = true }
istmo-macros = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
pollster = { workspace = true }
log = "0.4"

# --- Mobile (cdylib + staticlib) -----------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
egui = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android_logger = "0.14"

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false }

# --- Desktop (bin) -------------------------------------------------------
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = { version = "0.29", default-features = false }

[build-dependencies]
istmo-build = { workspace = true }
istmo-live-activity = { workspace = true, features = ["codegen"] }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"
