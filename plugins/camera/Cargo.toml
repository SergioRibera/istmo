[package]
name = "istmo-camera"
version = "0.1.1-alpha.4"
description = "Cross-platform camera plugin for the istmo framework — enumerate devices, stream frames in real time, and drive controls through a typed Rust surface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["istmo", "camera", "video", "capture", "mobile"]
categories = ["multimedia::images", "multimedia::video", "api-bindings"]
links = "istmo_camera"

[features]
default = []
codegen = ["dep:istmo-build"]
# Enables the pure-Rust `nokhwa`-backed desktop host.
# Mobile crates leave this off — Kotlin / Swift backends do the real
# capture there.
desktop = ["dep:nokhwa"]
# Enables the wasm32 host built on `web-sys` + `getUserMedia`.
# Downstream apps targeting `wasm32-unknown-unknown` turn this on;
# the `[target]`-gated deps are inert on every other target.
web = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:send_wrapper",
    "dep:web-sys",
]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
oneshot = { workspace = true }
tracing = { workspace = true }
istmo-build = { workspace = true, optional = true }

# Desktop capture backend — V4L2 on Linux, AVFoundation on macOS,
# Media Foundation on Windows. Opt-in via the `desktop` feature so
# mobile targets don't drag it in.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# Drop `decoding` (mozjpeg-sys) — desktop ships raw frames; MJPEG stays
# a camera's own capture format, we don't decode on CPU.
nokhwa = { version = "0.10", default-features = false, features = ["input-native", "output-threaded"], optional = true }

# Browser capture backend — pure wasm32, uses `navigator.mediaDevices`
# directly through `web-sys`. Gated behind the `web` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# `send_wrapper` lets us satisfy the plugin surface's `Send + Sync`
# bounds even though web-sys types are `!Send` + `!Sync`. Safe here
# because `wasm32-unknown-unknown` is single-threaded.
send_wrapper = { version = "0.6", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlVideoElement",
    "ImageData",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackCapabilities",
    "MediaTrackConstraintSet",
    "MediaTrackConstraints",
    "MediaTrackSettings",
    "Navigator",
    "Node",
    "Performance",
    "Permissions",
    "PermissionDescriptor",
    "PermissionName",
    "PermissionState",
    "PermissionStatus",
    "Window",
] }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }

[lints]
workspace = true
