[package]
name = "istmo-notifications"
version = "0.1.1-alpha.7"
description = "Local notifications for the istmo framework on Android, iOS, macOS, Windows, Linux and the web: live progress updates, actions and inline replies, conversations, scheduling, with simulations where a platform lacks a feature."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
include = ["/src", "/web", "/build.rs", "/istmo.toml", "/README.md", "/LICENSE*"]
keywords = ["istmo", "notifications", "toast", "reminders", "progress"]
categories = ["gui", "os", "api-bindings"]
links = "istmo_notifications"

[features]
# `FakeNotifications`: an in-memory host that records calls, for app tests.
testing = []

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
# `DeepLinks::publish` for responses that carry a URL.
istmo-plugins = { workspace = true }
flume = { workspace = true }
oneshot = { workspace = true }
tracing = { workspace = true }
# Calendar rules: civil dates, IANA zones, DST gaps and overlaps. Default
# features bundle the tz database where the OS has none (Windows, wasm);
# no serde.
jiff = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The live-update sender blocks on its one call in flight.
pollster = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# freedesktop Notifications, the notification portal and kuiserver on the
# session bus; blocking API, no tokio.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The live-update sender runs as a local task; `js` gives jiff the
# browser's time zone.
wasm-bindgen-futures = "0.4"
jiff = { version = "1.0", features = ["js"] }
# The web host: the Notification API, the service worker and IndexedDB
# through `js_sys` lookups (no web-sys features), the clock
# (`Date.now`), and `SendWrapper` around JS objects in a `Send + Sync`
# host (sound: wasm32-unknown-unknown is single-threaded).
wasm-bindgen = "0.2"
js-sys = "0.3"
send_wrapper = "0.6"

# Toasts (WinRT), the COM activator, the process AUMID and the elevation
# check; registry keys without unsafe.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
] }
# `#[implement]` of the class factory and the activator.
windows-core = "0.62"
# `IVectorView` / `IMap` (history, scheduled toasts, data values).
windows-collections = "0.3"
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# UNUserNotificationCenter through objc2's generated bindings; Intents
# for communication notifications (macOS 12+).
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSProcessInfo",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNError",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationAttachment",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
objc2-intents = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "INImage",
    "INIntent",
    "INIntentResponse",
    "INInteraction",
    "INOutgoingMessageType",
    "INPerson",
    "INPersonHandle",
    "INSendMessageAttachment",
    "INSendMessageIntent",
    "INSpeakableString",
] }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
istmo-build = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A fake notification server on a private bus (tests/linux_dbus.rs).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# `tests/web.rs` runs under `wasm-bindgen-test-runner` (Node).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
# The workspace lints, except `unsafe_code`: denied crate-wide so the
# Windows (COM) and macOS (objc2) backends can allow it per module, like
# plugins/tray. Keep in sync with [workspace.lints].
unknown_lints = { level = "allow", priority = -2 }
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
unused_async_trait_impl = "allow"
# Every unsafe block states the invariants it relies on.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
