# xcodegen spec for the full-Rust mobile demo (iOS side).
#
# Generate the .xcodeproj with:
#
#   cd examples/rust-mobile-demo/ios && xcodegen generate
#
# The .xcodeproj is not checked into the repo (see .gitignore). Regenerating
# is deterministic — the day-to-day flow is `xcodegen generate` once and
# then `xcodebuild` / Xcode against the result.
#
# The demo owns the whole event loop through winit + eframe on the Rust
# side; the Swift shell reduces to a `main.swift` that starts the transport
# and hands control to Rust via `istmo_run_ios`.

# `RustMobileDemo/istmo-plugins.yml` is generated by the crate's build.rs (any
# `cargo build` of the crate writes it; run one before the first
# `xcodegen generate`). It brings in the plugin sources, the app identity
# and deployment target from istmo.toml, the Rust library link settings
# and the pre-build phase that runs cargo.

name: RustMobileDemo

include:
  - path: RustMobileDemo/istmo-plugins.yml

options:
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  # SPM does not support subpath references, so the canonical
  # `IstmoRuntime` sources live under `runtime/ios/Sources/IstmoRuntime`
  # in the monorepo, discovered through the root `Package.swift`. The
  # relative path from `examples/rust-mobile-demo/ios/` to the repo root
  # is three directories up.
  IstmoRuntime:
    path: ../../..
  # GoogleSignIn-iOS comes from the google-sign-in plugin's
  # `[[swift_package]]`, declared and linked by the included
  # `istmo-plugins.yml`.
  # Google Mobile Ads (AdMob) SDK.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads-ios
    from: 11.0.0

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  RustMobileDemo:
    type: application
    platform: iOS
    sources:
      - path: RustMobileDemo
    info:
      path: RustMobileDemo/Info.plist
    dependencies:
      - package: IstmoRuntime
        product: IstmoRuntime
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.istmo.rustmobile.RustMobileDemo
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
