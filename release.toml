allow-branch = ["main"]

# One version for every workspace member (crates + plugins + examples).
shared-version = true
consolidate-commits = true

# Publish + tag + push semantics.
release = true
publish = false
verify = true
push = true
tag = true
sign-commit = true
sign-tag = true
dependent-version = "upgrade"
metadata = "optional"

# Tag ↔ workflow contract.
#
# `publish-runtime.yml` triggers on `push: tags: 'v[0-9]+.[0-9]+.[0-9]+'`
# (+ SemVer prerelease suffix). The `v` prefix is intentional so plain
# `<version>` git objects (bincode `0` on the wire, etc.) never collide
# with release tags.
tag-name = "v{{version}}"
tag-message = "istmo v{{version}}"
pre-release-commit-message = "chore(release): {{version}}"

# Non-Cargo surfaces that carry a version string. `min = 0` keeps
# consolidated releases happy — the substitution runs once per file even
# when cargo-release walks every workspace member.
pre-release-replacements = [
    # Kotlin runtime property consumed by the GitHub Action to stamp
    # the published AAR with the release SemVer.
    { file = "runtime/android/gradle.properties", search = "^runtimeVersion=.*$", replace = "runtimeVersion={{version}}" },

    # Coordinate references baked into the reference demos + runtime README.
    { file = "runtime/README.md", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+', replace = "dev.istmo:istmo-runtime:{{version}}" },
    { file = "examples/data-store-demo/android/app/build.gradle.kts", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+', replace = "dev.istmo:istmo-runtime:{{version}}" },
    { file = "examples/rust-mobile-demo/android/app/build.gradle.kts", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+', replace = "dev.istmo:istmo-runtime:{{version}}" },
    { file = "examples/live-activity-demo/android/app/build.gradle.kts", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+', replace = "dev.istmo:istmo-runtime:{{version}}" },
]
