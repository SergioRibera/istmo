name: publish-runtime

# Publishes two Kotlin artefacts to Maven Central (Sonatype Central
# Portal) as part of every release:
#   * `dev.istmo:istmo-runtime:<version>`        — the AAR + sources +
#     Javadoc JARs
#   * `dev.istmo:istmo-gradle-plugin:<version>`  — the `dev.istmo.app`
#     Gradle plugin: builds the app's Rust crate with cargo, links every
#     istmo plugin it depends on and applies istmo.toml `[app]`.
#
# * The **primary trigger** is a pushed `v<SemVer>` tag — that is how
#   `cargo-release` cuts a release. The workflow reads the SemVer from
#   the tag ref, bumps the Gradle version in the runner's checkout, and
#   publishes.
# * The **secondary trigger** is `workflow_dispatch` — useful for
#   re-running a release, publishing a hotfix, or dry-running the Gradle
#   config without a real tag.
#
# The Swift package has no publish step: SPM resolves consumers straight
# from the git tag (`.package(url:, from: "0.2.0")`), so tagging alone is
# enough for the iOS side. `cargo-release` creates the tag once and both
# language surfaces pick it up.
#
# The workflow never pushes commits back to `main`. The Gradle version
# bumps live in the runner's checkout for the duration of the build;
# `runtime/android/gradle.properties` and
# `runtime/gradle-plugin/gradle.properties` on trunk keep whatever
# baseline SemVer they declared before the release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   * `MAVEN_CENTRAL_USERNAME`  — Central Portal user token username
#     (https://central.sonatype.com/account → "Generate User Token").
#   * `MAVEN_CENTRAL_PASSWORD`  — the paired token password.
#   * `MAVEN_SIGNING_KEY`       — ASCII-armored GPG private key (the
#     full `-----BEGIN PGP PRIVATE KEY BLOCK-----` block). Export with
#     `gpg --armor --export-secret-keys <keyid>`.
#   * `MAVEN_SIGNING_PASSWORD`  — passphrase for the key.
#
# The `dev.istmo` namespace must be verified on Central Portal before
# the first successful publish; the workflow fails with a 403 otherwise.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to publish (e.g. 0.2.0). Overrides the tag-derived version when re-running by hand."
        required: false
        type: string
      dry_run:
        description: "Skip the actual publish — useful for verifying the Gradle config."
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            resolved="$INPUT_VERSION"
          else
            resolved="${TAG_REF##*/v}"
          fi
          if ! echo "$resolved" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::resolved version is not SemVer (got: '$resolved'). Provide a valid `inputs.version` or push a `v<SemVer>` tag."
            exit 1
          fi
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "Publishing istmo-runtime version: $resolved"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Bump Gradle versions
        env:
          VERSION: ${{ steps.version.outputs.resolved }}
        run: |
          sed -i -E "s/^runtimeVersion=.*/runtimeVersion=$VERSION/" runtime/android/gradle.properties
          sed -i -E "s/^pluginVersion=.*/pluginVersion=$VERSION/" runtime/gradle-plugin/gradle.properties
          echo "runtime/android/gradle.properties after bump:"
          grep '^runtimeVersion' runtime/android/gradle.properties
          echo "runtime/gradle-plugin/gradle.properties after bump:"
          grep '^pluginVersion' runtime/gradle-plugin/gradle.properties

      - name: Assemble runtime AAR
        working-directory: runtime/android
        run: gradle --no-daemon assembleRelease

      - name: Assemble Gradle plugin JAR
        working-directory: runtime/gradle-plugin
        run: gradle --no-daemon jar

      # `com.vanniktech.maven.publish` reads Sonatype credentials and
      # the GPG signing key from these Gradle properties (via the
      # `ORG_GRADLE_PROJECT_*` env-var convention). The key must be the
      # full ASCII-armored private key body; `signingInMemoryKeyId` is
      # optional when the key file contains a single secret key.
      - name: Publish runtime to Maven Central
        if: ${{ !inputs.dry_run }}
        working-directory: runtime/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: gradle --no-daemon publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Publish Gradle plugin to Maven Central
        if: ${{ !inputs.dry_run }}
        working-directory: runtime/gradle-plugin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: gradle --no-daemon publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.resolved }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## istmo runtime v$VERSION"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "**Dry run** — Gradle assembled, nothing published."
            else
              echo "* Kotlin runtime: [\`dev.istmo:istmo-runtime:$VERSION\`](https://central.sonatype.com/artifact/dev.istmo/istmo-runtime/$VERSION)"
              echo "* Gradle plugin \`dev.istmo.app\`: [\`dev.istmo:istmo-gradle-plugin:$VERSION\`](https://central.sonatype.com/artifact/dev.istmo/istmo-gradle-plugin/$VERSION)"
              echo "* Swift: \`.package(url: \"https://github.com/SergioRibera/istmo.git\", from: \"$VERSION\")\` (resolved from the git tag directly)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
