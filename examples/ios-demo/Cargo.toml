[package]
name = "istmo-ios-demo"
version = "0.0.0"
description = "Minimal iOS app that exercises the istmo runtime end-to-end."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# staticlib produces a `.a` that Xcode links into the app target directly.
# cdylib would give a `.dylib` which iOS forbids embedding except as an
# XCFramework — extra step for zero benefit at this scale.
crate-type = ["staticlib"]

[dependencies]
istmo = { path = "../.." }
bincode = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"
