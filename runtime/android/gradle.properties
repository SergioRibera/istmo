android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Coordinates published to GitHub Packages Maven registry
# (https://maven.pkg.github.com/SergioRibera/istmo). The `publish-runtime`
# workflow overrides `istmoRuntime.version` from its `workflow_dispatch`
# input; the default here keeps local builds pointing at the current
# development version.
runtimeGroup=dev.istmo
runtimeArtifact=istmo-runtime-android
runtimeVersion=0.1.0
