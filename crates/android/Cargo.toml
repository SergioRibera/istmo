[package]
name = "istmo-android"
version = "0.0.0"
description = "Android JNI transport for the istmo runtime."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
istmo-core = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
tracing = { workspace = true }
jni = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# Overrides workspace-wide forbid: JNI requires unsafe.
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
# Rust's `unreachable_pub` and clippy's `redundant_pub_crate` contradict for
# `pub` items inside private modules. We keep `unreachable_pub` (rust warns
# by workspace policy) and silence the clippy counterpart.
redundant_pub_crate = "allow"
