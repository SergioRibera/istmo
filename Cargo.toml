[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/build",
    "crates/macros",
    "crates/android",
    "crates/ios",
    "crates/plugins",
    "crates/plugins-schema",
    "crates/window",
    "examples/android-demo",
    "examples/android-multi/crates/app",
    "examples/android-multi/crates/widget",
    "examples/ios-demo",
    "examples/rust-mobile-demo",
    "plugins/google-sign-in",
    "plugins/data-store",
    "plugins/file-picker",
    "plugins/live-activity",
    "plugins/istmo-pen",
    "plugins/share",
    "examples/data-store-demo",
    "examples/live-activity-demo",
    "examples/pen-demo",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <sergioalejandroriberacosta@gmail.com>", "istmo contributors"]
repository = "https://github.com/SergioRibera/istmo"
homepage = "https://github.com/SergioRibera/istmo"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bincode = { version = "2", default-features = false, features = ["derive", "std"] }
flume = { version = "0.11", default-features = false, features = ["async", "select"] }
oneshot = { version = "0.1", default-features = false, features = ["std", "async"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = "0.4"
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = [
    "parsing",
    "printing",
    "proc-macro",
    "full",
    "extra-traits",
    "clone-impls",
] }
jni = { version = "0.21", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

istmo-core = { path = "crates/core", version = "0.1.1-alpha.2" }
istmo-build = { path = "crates/build", version = "0.1.1-alpha.2" }
istmo-macros = { path = "crates/macros", version = "0.1.1-alpha.2" }
istmo-android = { path = "crates/android", version = "0.1.1-alpha.2" }
istmo-ios = { path = "crates/ios", version = "0.1.1-alpha.2" }
istmo-plugins = { path = "crates/plugins", version = "0.1.1-alpha.2" }
istmo-plugins-schema = { path = "crates/plugins-schema", version = "0.1.1-alpha.2" }
istmo-window = { path = "crates/window", version = "0.1.1-alpha.2" }

istmo-google-sign-in = { path = "plugins/google-sign-in", version = "0.1.1-alpha.2" }
istmo-data-store = { path = "plugins/data-store", version = "0.1.1-alpha.2" }
istmo-live-activity = { path = "plugins/live-activity", version = "0.1.1-alpha.2" }
istmo-pen = { path = "plugins/istmo-pen", version = "0.1.1-alpha.2" }
istmo-file-picker = { path = "plugins/file-picker", version = "0.1.1-alpha.2" }
istmo-share = { path = "plugins/share", version = "0.1.1-alpha.2" }

[package]
name = "istmo"
version = "0.1.1-alpha.2"
description = "Rust ↔ mobile native interop framework — write shared Rust code, ship it to Android + iOS through a typed plugin contract."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mobile", "android", "ios", "ffi", "interop"]
categories = ["development-tools::ffi", "os", "api-bindings"]

[features]
# Forward the activity-flavor selection to `istmo-android`. Consumers
# building the facade for Android pick exactly one. Keep
# `native-activity` as the default so existing demos continue to work
# unchanged; pen-demo opts into `game-activity` explicitly.
default = ["native-activity"]
native-activity = ["istmo-android/native-activity"]
game-activity = ["istmo-android/game-activity"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
istmo-plugins = { workspace = true }
bincode = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Skip workspace inheritance so we can flip `default-features = false`
# and let facade features pick the activity flavor (see the
# `native-activity` / `game-activity` features above). Cargo forbids
# overriding workspace `default-features` from an inheriting crate.
istmo-android = { path = "crates/android", version = "0.1.1-alpha.2", default-features = false }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
istmo-ios = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
flume = { workspace = true }

[lints]
workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "runtime/android/gradle.properties", search = "^runtimeVersion=.*$", replace = "runtimeVersion={{version}}" },
    { file = "runtime/gradle-plugin/gradle.properties", search = "^pluginVersion=.*$", replace = "pluginVersion={{version}}" },
    { file = "runtime/README.md", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "dev.istmo:istmo-runtime:{{version}}" },
    { file = "examples/data-store-demo/android/app/build.gradle.kts", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "dev.istmo:istmo-runtime:{{version}}" },
    { file = "examples/rust-mobile-demo/android/app/build.gradle.kts", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "dev.istmo:istmo-runtime:{{version}}" },
    { file = "examples/live-activity-demo/android/app/build.gradle.kts", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "dev.istmo:istmo-runtime:{{version}}" },
    { file = "examples/pen-demo/android/app/build.gradle.kts", search = 'dev\.istmo:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "dev.istmo:istmo-runtime:{{version}}" },
]

