[package]
name = "pen-demo"
version = "0.1.1-alpha.1"
description = "Multi-platform istmo demo — same Rust code subscribes to stylus events on desktop and Android."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "pen-demo"
path = "src/main.rs"

[features]
default = []
libinput = ["istmo-pen/libinput"]

[dependencies]
istmo = { path = "../.." }
istmo-core = { workspace = true }
istmo-pen = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
pollster = { workspace = true }
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "x11"] }
raw-window-handle = { version = "0.6", default-features = false }
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[build-dependencies]
istmo-build = { workspace = true }
istmo-pen = { workspace = true, features = ["codegen"] }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"
