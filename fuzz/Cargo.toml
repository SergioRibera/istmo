[package]
name = "istmo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
istmo-core = { path = "../crates/core" }
istmo-build = { path = "../crates/build" }

# Fuzz targets build on nightly with their own flags; keep them out of the
# main workspace and its lockfile.
[workspace]

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handover"
path = "fuzz_targets/handover.rs"
test = false
doc = false
bench = false
