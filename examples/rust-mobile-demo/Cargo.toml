[package]
name = "rust-mobile-demo"
version = "0.0.0"
description = "Full-Rust mobile demo — egui UI driving google_sign_in + notifications + permissions plugins."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `cdylib` for android (`.so` loaded by the Kotlin runtime), `staticlib`
# for iOS (linked into the app executable). Both artefacts fall out of the
# same source; the target-specific build system picks the right one.
crate-type = ["cdylib", "staticlib"]

[dependencies]
istmo = { path = "../.." }
istmo-plugins = { workspace = true }
log = "0.4"
pollster = { workspace = true }
bincode = { workspace = true }

# build.rs regenerates the Swift host dispatchers under
# `ios/RustMobileDemo/Plugins/*/Generated/` on every cargo build so the
# checked-in wire schema stays in lockstep with the Rust plugin
# definitions. `codegen` exposes `istmo_plugins::contract::*` builders;
# `istmo-build` renders them into Swift source.
[build-dependencies]
istmo-plugins-schema = { workspace = true }
istmo-build = { workspace = true }

# The demo picks eframe + wgpu as its UI stack; istmo itself is
# UI-agnostic, so these live in the demo's own Cargo.toml, not in the
# framework crates.
# eframe / egui / winit pinned at 0.29 / 0.30 — the demo UI code uses
# the `Margin::same(f32)` / `TopBottomPanel::show(&Context, …)` shape
# from that release. Bumping to 0.36 is a follow-up migration touching
# ~20 call sites (Margin is i8 in 0.36, panels take `&mut Ui`, etc).
# `SafeAreaPublisher` no longer needs a window handle from eframe — it
# walks `UIApplication.keyWindow` / the Android Activity directly — so
# the bump is purely UI-code cosmetics and can happen on its own PR.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
egui = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android_logger = "0.14"
istmo-plugins = { workspace = true, features = ["winit-publisher"] }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false }
istmo-plugins = { workspace = true, features = ["winit-publisher"] }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"
