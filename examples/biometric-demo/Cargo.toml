[package]
name = "biometric-demo"
version = "0.1.1-alpha.2"
description = "Multi-platform istmo demo — the same Rust code checks biometrics, authenticates and keeps biometric-bound secrets on desktop, Android and iOS."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "biometric-demo"
path = "src/main.rs"

[dependencies]
# `BiometricPrompt` needs a `FragmentActivity`; `GameActivity` is one,
# `NativeActivity` is not — hence the facade's game-activity flavour.
istmo = { path = "../..", default-features = false, features = ["game-activity"] }
istmo-core = { workspace = true }
istmo-biometric = { workspace = true }
flume = { workspace = true }
pollster = { workspace = true }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "android-game-activity"] }
egui = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
android_logger = "0.14"

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.29", default-features = false }
winit = { version = "0.30", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = { version = "0.29", default-features = false }
env_logger = "0.11"

[build-dependencies]
istmo-build = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"
