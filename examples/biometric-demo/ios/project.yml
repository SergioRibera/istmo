# xcodegen spec for the biometric demo (iOS side).
#
# Generate the .xcodeproj with:
#
#   cd examples/biometric-demo/ios && xcodegen generate
#
# `BiometricDemo/istmo-plugins.yml` is generated by the crate's build.rs (any
# `cargo build` of the crate writes it; run one before the first
# `xcodegen generate`). It brings in the plugin sources, the app identity
# and deployment target from istmo.toml, the Rust library link settings
# and the pre-build phase that runs cargo.

name: BiometricDemo

include:
  - path: BiometricDemo/istmo-plugins.yml

options:
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  # Root `Package.swift` vends `IstmoRuntime`; three directories up from
  # `examples/biometric-demo/ios/`.
  IstmoRuntime:
    path: ../../..

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BiometricDemo:
    type: application
    platform: iOS
    sources:
      - path: BiometricDemo
    info:
      path: BiometricDemo/Info.plist
    dependencies:
      - package: IstmoRuntime
        product: IstmoRuntime
      - sdk: LocalAuthentication.framework
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
