[package]
name = "istmo-screen-capture"
version = "0.1.1-alpha.7"
description = "Cross-platform screen capture plugin for the istmo framework: screenshots and live streams of monitors, windows and regions with an honest capability report and zero-copy frame sinks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["istmo", "screen-capture", "screenshot", "wayland", "pipewire"]
categories = ["multimedia::video", "api-bindings"]
links = "istmo_screen_capture"

[features]
# Every Linux backend except KMS (KMS is opt-in twice: its feature and
# `CapturePolicy::allow_kms`), and every Windows backend. The
# dependencies are gated on their target OS, so these features are inert
# elsewhere: a build with no backend for its target answers
# `NoBackendCompiled` at run time instead of failing to compile.
default = [
    "linux-portal",
    "linux-ext-image-copy",
    "linux-wlr-screencopy",
    "linux-x11",
    "linux-audio",
    "windows-wgc",
    "windows-dxgi",
    "windows-gdi",
    "windows-audio",
]
# xdg-desktop-portal ScreenCast + PipeWire video (DMA-BUF zero-copy with
# the compositor's dmabuf feedback, explicit sync through DRM syncobjs).
# Needs libpipewire at build time (pkg-config, bindgen) and at run time.
linux-portal = ["dep:ashpd", "dep:pollster", "dep:async-io", "dep:drm", "pipewire", "wayland", "dmabuf-alloc"]
# ext-image-copy-capture-v1 (Sway 1.11, Hyprland, COSMIC, ...).
linux-ext-image-copy = ["wayland", "dmabuf-alloc"]
# zwlr_screencopy_manager_v1 (wlroots compositors, niri).
linux-wlr-screencopy = ["wayland", "dmabuf-alloc"]
# X11: XShm, Composite, XDamage, XFixes. Pure Rust, no libxcb.
linux-x11 = ["dep:x11rb"]
# System / application audio through PipeWire.
linux-audio = ["pipewire"]
# Internal: Wayland client plumbing shared by the direct backends.
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]
# Internal: GBM DMA-BUF pools for the direct Wayland backends (links
# libgbm, which every Mesa / NVIDIA desktop install ships).
dmabuf-alloc = ["dep:gbm", "dep:drm", "dep:drm-fourcc"]
# Internal: the PipeWire client shared by portal video and audio.
pipewire = ["dep:pipewire", "dep:libspa"]
# Windows.Graphics.Capture: monitors and windows as D3D11 textures
# (Windows 10 1903+).
windows-wgc = ["windows-common"]
# DXGI Desktop Duplication: monitors, one mandatory GPU copy per frame.
windows-dxgi = ["windows-common"]
# GDI `BitBlt` / `PrintWindow`: CPU frames, the last resort.
windows-gdi = ["windows-common"]
# System and per-process loopback audio through WASAPI.
windows-audio = ["windows-common"]
# Internal: the Win32 / WinRT bindings, D3D11 helpers and the source
# listing every Windows backend shares.
windows-common = ["dep:windows", "dep:windows-core", "dep:windows-future", "dep:windows-collections"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
istmo-media = { workspace = true }
flume = { workspace = true }
oneshot = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "time", "mm", "fs", "shm", "event", "param"] }
# `async-io` (not tokio): zbus must never need a tokio reactor, the
# host runs on whatever executor polls it.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"], optional = true }
# Blocks on the portal's D-Bus futures on the backend's own threads.
pollster = { workspace = true, optional = true }
# PRIME export with DRM_CLOEXEC, so no exported fd ever lacks it.
drm = { version = "0.14", optional = true }
drm-fourcc = { version = "2.2", optional = true }
gbm = { version = "0.18", default-features = false, features = ["drm-support"], optional = true }
libspa = { version = "0.10", optional = true }
pipewire = { version = "0.10", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
x11rb = { version = "0.14", default-features = false, features = ["randr", "xfixes", "shm", "composite", "damage"], optional = true }
# Timers for the portal dialog wait (ashpd already runs on async-io).
async-io = { version = "2.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Wdk_System_SystemServices",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.62", optional = true }
# `IAsyncOperation::get` (the borderless consent prompt).
windows-future = { version = "0.3", default-features = false, features = ["std"], optional = true }
# `IVectorView` (WGC dirty regions).
windows-collections = { version = "0.3", optional = true }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
istmo-build = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The live PipeWire test asks niri's Mutter ScreenCast API for a stream
# directly (no portal dialog); same zbus and runtime as ashpd.
zbus = { version = "6.5", default-features = false, features = ["default-rt", "proxy"] }

[lints.rust]
# The workspace lints, except `unsafe_code`: denied crate-wide and
# allowed (with a reason) only on the FFI modules that need it — PipeWire
# buffer leases and metas, `mmap` of shared-memory frames — like
# crates/android and crates/ios. Keep in sync with [workspace.lints].
unknown_lints = { level = "allow", priority = -2 }
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unused_async_trait_impl = "allow"
# Every unsafe block states the invariants it relies on.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
