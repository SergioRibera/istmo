    { file = "examples/camera-demo/android/app/build.gradle.kts", search = 'io\.github\.sergioribera:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "io.github.sergioribera:istmo-runtime:{{version}}", prerelease = true },
