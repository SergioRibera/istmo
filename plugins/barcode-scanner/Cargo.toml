[package]
name = "istmo-barcode-scanner"
version = "0.1.1-alpha.4"
description = "Cross-platform barcode and QR scanner plugin for the istmo framework — Google code scanner on Android, AVFoundation on iOS."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["istmo", "qr", "barcode", "scanner", "mobile"]
categories = ["multimedia::images", "api-bindings"]
links = "istmo_barcode_scanner"

[features]
default = []
codegen = ["dep:istmo-build"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
bincode = { workspace = true }
istmo-build = { workspace = true, optional = true }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
istmo-core = { workspace = true }
flume = { workspace = true }
pollster = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
redundant_pub_crate = "allow"
