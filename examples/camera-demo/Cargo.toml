[package]
name = "camera-demo"
version = "0.1.1-alpha.5"
description = "Shared Rust camera demo for istmo-camera — single eframe + egui app that runs natively on Linux/macOS/Windows and in the browser via wasm32."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "camera-demo"
path = "src/main.rs"

[dependencies]
# The facade gives us `#[istmo::mobile_app]` + `istmo::runtime!` +
# `istmo::android::android_app`. `game-activity` is on by default so
# the Android build sits on `IstmoGameActivity` — a ComponentActivity,
# which `istmo-camera`'s backend needs for `ActivityResultContracts`.
istmo = { path = "../..", default-features = false, features = ["game-activity"] }
istmo-core = { workspace = true }
istmo-camera = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
pollster = { workspace = true }
log = "0.4"
egui = { version = "0.29", default-features = false }

# Desktop targets: eframe with glow + wayland/x11 + the real desktop
# camera backend from istmo-camera.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
env_logger = "0.11"
istmo-camera = { workspace = true, features = ["desktop"] }

# Android — GameActivity + wgpu through the android-game-activity
# feature set; CameraX / native-side plumbing arrives through
# `istmo-camera`'s Kotlin backend.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "android-game-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
android_logger = "0.14"

# Browser target: eframe wasm_bindgen entry + the web backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
istmo-camera = { workspace = true, features = ["web"] }

[build-dependencies]
istmo-build = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
