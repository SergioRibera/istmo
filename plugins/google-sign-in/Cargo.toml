[package]
name = "istmo-google-sign-in"
version = "0.1.1-alpha.2"
description = "Google Sign-In / Credential Manager plugin for the istmo framework — Android + iOS credential flows exposed as a typed Rust surface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["istmo", "google-signin", "oauth", "authentication", "mobile"]
categories = ["authentication", "api-bindings"]
links = "istmo_google_sign_in"

[features]
default = []
codegen = ["dep:istmo-build"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
bincode = { workspace = true }
pollster = { workspace = true }
istmo-build = { workspace = true, optional = true }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
flume = { workspace = true }
pollster = { workspace = true }

[lints]
workspace = true

