[package]
name = "istmo-build"
version = "0.1.1-alpha.5"
description = "Contract metadata and Kotlin/Swift codegen for istmo plugins — consumed by downstream build.rs scripts to emit typed native dispatchers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["istmo", "codegen", "kotlin", "swift", "build-script"]
categories = ["development-tools::build-utils"]

[dependencies]
wincode = { workspace = true }
toml_edit = { workspace = true }
syn = { workspace = true }
# `span-locations` lets parse errors report a line and column.
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
plist = { version = "1.7", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
embed-resource = "3.0"
globset = { version = "0.4", default-features = false }

[dev-dependencies]
# `tests/native_wire.rs` compiles the generated Rust golden and pins the
# bytes the Kotlin/Swift codecs must produce for it.
istmo-core = { workspace = true }
istmo-macros = { workspace = true }

[lints.rust]
# `contract::wire` hand-writes wincode impls for a recursive type; the
# rest of the crate stays free of `unsafe` (each impl carries a SAFETY note).
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Conflicts with `unreachable_pub` for items of private modules.
redundant_pub_crate = "allow"
