[package]
name = "istmo-data-store"
version = "0.1.1-alpha.5"
description = "Persistent key-value store plugin for the istmo framework — SharedPreferences on Android, UserDefaults on iOS, file-backed under istmo_core::path::preference_dir on desktop."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
include = ["/src", "/build.rs", "/istmo.toml", "/native", "/README.md", "/LICENSE*"]
keywords = ["istmo", "storage", "shared-preferences", "userdefaults", "mobile"]
categories = ["database", "api-bindings"]
links = "istmo_data_store"

[features]
default = []
codegen = ["dep:istmo-build"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
wincode = { workspace = true }
tracing = { workspace = true }
pollster = { workspace = true }
istmo-build = { workspace = true, optional = true }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
flume = { workspace = true }
pollster = { workspace = true }

[lints]
workspace = true

