android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Coordinates published to Maven Central via the Sonatype Central
# Portal (https://central.sonatype.com/artifact/io.github.sergioribera/istmo-runtime).
# Shares the release version of the crates, the Swift package tag and
# `pluginVersion` in `runtime/gradle-plugin/gradle.properties`:
# cargo-release rewrites it (`pre-release-replacements` in the root
# `Cargo.toml`), the `publish-runtime` workflow sets it from its input,
# and `crates/build/tests/release_versions.rs` fails when it drifts.
runtimeGroup=io.github.sergioribera
runtimeArtifact=istmo-runtime
runtimeVersion=0.1.1-alpha.5
