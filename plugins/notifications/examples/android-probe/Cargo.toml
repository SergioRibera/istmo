[package]
name = "notifications-probe"
version = "0.0.0"
description = "On-device checks of istmo-notifications' Android backend."
publish = false
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

# Its own workspace: the probe is built only for Android by its Gradle
# project, never by the istmo workspace's `cargo` gates.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
istmo = { path = "../../../.." }
istmo-core = { path = "../../../../crates/core" }
istmo-notifications = { path = "../.." }
pollster = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = { version = "0.21", default-features = false }
log = "0.4"

[build-dependencies]
istmo-build = { path = "../../../../crates/build" }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# JNI entry points are `#[unsafe(no_mangle)]`.
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
