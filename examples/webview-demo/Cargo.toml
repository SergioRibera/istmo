[package]
name = "webview-demo"
version = "0.1.1-alpha.6"
description = "Desktop istmo demo: a small browser on istmo-webview, a local page served from app assets that talks to Rust over the bridge, and Microsoft sign-in through istmo-web-auth."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
istmo-core = { workspace = true }
istmo-webview = { workspace = true, features = ["desktop"] }
istmo-web-auth = { path = "../../plugins/web-auth", features = ["desktop"] }
istmo-window = { workspace = true }
pollster = { workspace = true }
flume = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = { version = "0.29", default-features = false }
env_logger = "0.11"

[build-dependencies]
istmo-build = { workspace = true }

[features]
# Also offer Qt WebEngine (needs Qt 6 development files to build the shim).
qt = ["istmo-webview/linux-qt"]

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
