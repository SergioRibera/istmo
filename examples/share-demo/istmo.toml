[app]
# App identity: applied to Gradle by `io.github.sergioribera.istmo` and to Xcode through
# the generated `ios/.istmo/Istmo.xcconfig`. The version comes from
# Cargo.toml.
id = "dev.istmo.sharedemo"
name = "istmo share demo"

# Rewords istmo.share's default photo-library usage string.
[app.info_plist]
NSPhotoLibraryAddUsageDescription = "The istmo share demo saves shared images to your photo library."

[min_versions]
android = 26
