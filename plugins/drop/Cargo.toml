[package]
name = "istmo-drop"
version = "0.1.1-alpha.6"
description = "Files dragged into the app from other apps for the istmo framework: Android drag and drop between apps and iPadOS drop interactions, delivered to Rust as copies the app owns."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["istmo", "drag-and-drop", "drop", "mobile", "files"]
categories = ["gui", "api-bindings"]
links = "istmo_drop"

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
flume = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
istmo-build = { workspace = true }
pollster = { workspace = true }

[lints.rust]
# Toolchains older than clippy 1.100 do not know `unused_async_trait_impl`.
unknown_lints = { level = "allow", priority = -2 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
redundant_pub_crate = "allow"
# Plugin traits are async; sync backends implement them with `async fn`
# rather than hand-built `std::future::ready` futures.
unused_async_trait_impl = "allow"
