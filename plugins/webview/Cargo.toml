[package]
name = "istmo-webview"
version = "0.1.1-alpha.6"
description = "Cross-platform web view plugin for the istmo framework: embedded or windowed views, navigation rules, a JS bridge bound to origins, custom schemes, profiles and cookies behind one typed Rust surface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["istmo", "webview", "browser", "mobile", "webkit"]
categories = ["gui", "web-programming", "api-bindings"]
links = "istmo_webview"

[features]
default = []
# `ScriptedWebView`: an engine-less host for testing app flows.
testing = []
# Rust hosts for Linux, macOS and Windows (Linux: WebKitGTK 4.1).
desktop = [
    "linux-webkit2gtk-4-1",
    "dep:istmo-window",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-web-kit",
    "dep:block2",
    "dep:dispatch2",
    "dep:webview2-com",
    "dep:windows",
]
# Linux engines, loaded with `dlopen` at run time: no headers or
# pkg-config at build time. Only one GTK / WebKit major per process.
linux-webkit2gtk-4-1 = ["dep:libloading", "dep:istmo-window"]
linux-webkitgtk-6-0 = ["dep:libloading", "dep:istmo-window"]
objc2 = ["dep:objc2"]
objc2-foundation = ["dep:objc2-foundation"]
objc2-app-kit = ["dep:objc2-app-kit"]
objc2-web-kit = ["dep:objc2-web-kit"]
block2 = ["dep:block2"]
dispatch2 = ["dep:dispatch2"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
flume = { workspace = true }
oneshot = { workspace = true }
tracing = { workspace = true }
url = "2.5"

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
# The scripted host drives the end-to-end tests.
istmo-webview = { path = ".", features = ["testing"] }
istmo-build = { workspace = true }
pollster = { workspace = true }

[lints.rust]
# Toolchains older than clippy 1.100 do not know `unused_async_trait_impl`.
unknown_lints = { level = "allow", priority = -2 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
# Engine bindings (desktop backends) opt in per module.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
redundant_pub_crate = "allow"
# Plugin traits are async; sync backends implement them with `async fn`
# rather than hand-built `std::future::ready` futures.
unused_async_trait_impl = "allow"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# The app registers the windows embedded views are placed in.
istmo-window = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", default-features = false, features = ["std"], optional = true }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"], optional = true }
objc2 = { version = "0.6", default-features = false, features = ["std"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSApplication", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSColor", "NSPrintOperation", "NSMenu", "objc2-core-foundation"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSUUID", "NSHTTPCookie", "NSObject", "NSSet", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSValue", "block2", "objc2-core-foundation"], optional = true }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKBackForwardList", "WKBackForwardListItem", "WKContentWorld", "WKFrameInfo", "WKHTTPCookieStore", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKPreferences", "WKScriptMessage", "WKScriptMessageHandlerWithReply", "WKSecurityOrigin", "WKUIDelegate", "WKURLSchemeHandler", "WKURLSchemeTask", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences", "WKWebsiteDataRecord", "WKWebsiteDataStore", "WKWindowFeatures", "WKOpenPanelParameters"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", default-features = false, features = ["std", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com_StructuredStorage", "Win32_UI_HiDpi"], optional = true }

[[example]]
name = "gtk_smoke"
required-features = ["desktop"]
