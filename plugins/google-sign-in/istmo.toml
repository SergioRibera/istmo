[plugin]
id = "istmo.google_sign_in"
client_type = "::istmo_google_sign_in::SignInClient"
android_package = "dev.istmo.plugins.googlesignin"
# Reference factories shipped in `native/`. Credential Manager presents
# over an Activity, so the Android factory takes the host activity.
android_backend = "dev.istmo.plugins.googlesignin.GoogleSignInFactoryImpl"
android_backend_arg = "activity"
ios_backend = "GoogleSignInFactoryImpl"

[[gradle]]
group = "androidx.credentials"
artifact = "credentials"
version = "1.3.0"

[[gradle]]
group = "androidx.credentials"
artifact = "credentials-play-services-auth"
version = "1.3.0"

[[gradle]]
scope = "api"
group = "com.google.android.libraries.identity.googleid"
artifact = "googleid"
version = "1.1.1"

# 7.1 adds the `nonce:` parameter to `GIDSignIn.signIn`.
[[swift_package]]
url = "https://github.com/google/GoogleSignIn-iOS.git"
product = "GoogleSignIn"
from_version = "7.1.0"

[min_versions]
# `androidx.credentials` 1.3 and `googleid` 1.1 minSdk.
android = 21
