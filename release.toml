allow-branch = ["main"]

shared-version = true
consolidate-commits = true

release = true
publish = false
verify = true
push = true
tag = true
sign-commit = true
sign-tag = true
dependent-version = "upgrade"
metadata = "optional"

tag-name = "v{{version}}"
tag-message = "istmo v{{version}}"
pre-release-commit-message = "chore(release): {{version}}"

