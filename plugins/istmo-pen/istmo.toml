[plugin]
id = "istmo.pen"
client_type = "::istmo_pen::PenClient"
android_package = "dev.istmo.plugins.pen"
default_deployment = "local"
auto_register = false

# Windows manifest fragments are XML snippets `istmo-build` composes into
# the consuming app's application manifest. The pen plugin needs pointer input
# messages (WM_POINTER*) to fire for stylus devices, which requires the app
# process to be DPI-aware; without this fragment Windows falls back to the
# legacy WM_TOUCH surface and stylus features (pressure/tilt/twist) are lost.
#
# Nothing to call: an app whose `build.rs` runs `istmo_build::emit()` embeds
# the composed manifest into its `.exe` when building for Windows.
[[windows_manifest_fragment]]
name = "dpi_aware"
xml = """
<asmv3:application xmlns:asmv3=\"urn:schemas-microsoft-com:asm.v3\">
  <asmv3:windowsSettings>
    <dpiAware xmlns=\"http://schemas.microsoft.com/SMI/2005/WindowsSettings\">true/pm</dpiAware>
    <dpiAwareness xmlns=\"http://schemas.microsoft.com/SMI/2016/WindowsSettings\">PerMonitorV2</dpiAwareness>
  </asmv3:windowsSettings>
</asmv3:application>
"""
