[package]
name = "istmo-android"
version = "0.1.1-alpha.2"
description = "Android JNI transport for the istmo runtime — pump thread, native trampolines, event-loop glue."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["istmo", "android", "jni", "ffi", "mobile"]
categories = ["os::android-apis", "development-tools::ffi"]

[features]
# Consumers pick the Android activity flavor via facade features. The
# `android-activity` crate refuses both simultaneously with a
# compile_error, so exactly one of `native-activity` / `game-activity`
# must be enabled per build. `native-activity` stays the default so
# existing demos (rust-mobile-demo, data-store-demo, live-activity-demo,
# android-demo) keep working without opt-in; pen-demo overrides via
# the facade's `game-activity` feature.
default = ["native-activity"]
native-activity = ["android-activity/native-activity"]
game-activity = ["android-activity/game-activity"]

[dependencies]
istmo-core = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
tracing = { workspace = true }
jni = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"

