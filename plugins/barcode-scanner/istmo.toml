[plugin]
id = "istmo.barcode_scanner"
client_type = "::istmo_barcode_scanner::BarcodeScannerClient"
default_deployment = "local"
# The Google code scanner presents its own activity from the host
# `ComponentActivity`.
android_backend = "dev.istmo.plugins.barcodescanner.BarcodeScannerBackendImpl"
android_backend_arg = "activity"

# The AVFoundation scanner needs camera access. Apps reword it through
# `[app.info_plist]`.
[plugin.info_plist]
NSCameraUsageDescription = "Scan QR codes to link devices and join shared documents."

# Google code scanner: Play services ships the camera UI and the
# decoder, so the app needs no CAMERA permission.
[[gradle]]
group = "com.google.android.gms"
artifact = "play-services-code-scanner"
version = "16.1.0"

[min_versions]
android = 21
ios = "13.0"
