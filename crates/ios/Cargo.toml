[package]
name = "istmo-ios"
version = "0.1.1-alpha.2"
description = "iOS/Apple FFI transport for the istmo runtime — pump thread, callback table, C-callable exports linked by the Swift staticlib."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["istmo", "ios", "swift", "ffi", "mobile"]
categories = ["os", "development-tools::ffi"]

[dependencies]
istmo-core = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
tracing = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSFileManager", "NSPathUtilities", "NSString", "NSURL", "NSArray"] }

[dev-dependencies]
pollster = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"

