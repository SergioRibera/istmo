[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/build",
    "crates/macros",
    "crates/android",
    "crates/ios",
    "crates/plugins",
    "crates/plugins-schema",
    "crates/media",
    "crates/menu",
    "crates/window",
    "crates/lint-check",
    "examples/android-demo",
    "examples/bench-android",
    "examples/android-multi/crates/app",
    "examples/android-multi/crates/widget",
    "examples/ios-demo",
    "examples/rust-mobile-demo",
    "plugins/google-sign-in",
    "plugins/data-store",
    "plugins/file-picker",
    "plugins/biometric",
    "plugins/live-activity",
    "plugins/istmo-pen",
    "plugins/share",
    "plugins/barcode-scanner",
    "plugins/opener",
    "plugins/camera",
    "plugins/dnd",
    "plugins/webview",
    "plugins/web-auth",
    "plugins/screen-capture",
    "plugins/tray",
    "plugins/launcher-actions",
    "examples/camera-demo",
    "examples/data-store-demo",
    "examples/live-activity-demo",
    "examples/pen-demo",
    "examples/share-demo",
    "examples/biometric-demo",
    "examples/webview-demo",
    "examples/tray-demo",
]

[workspace.package]
edition = "2024"
# wincode needs 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <sergioalejandroriberacosta@gmail.com>", "istmo contributors"]
repository = "https://github.com/SergioRibera/istmo"
readme = "README.md"

[workspace.lints.rust]
# Toolchains older than clippy 1.100 do not know `unused_async_trait_impl`.
unknown_lints = { level = "allow", priority = -2 }
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Plugin traits are async; sync backends implement them with `async fn`
# rather than hand-built `std::future::ready` futures.
unused_async_trait_impl = "allow"

[workspace.dependencies]
# Minor pinned: wincode is 0.x and its bytes are only checked against
# bincode 2 `standard()` by our golden tests.
wincode = { version = "0.6", default-features = false, features = ["derive", "std"] }
flume = { version = "0.11", default-features = false, features = ["async", "select"] }
oneshot = { version = "0.1", default-features = false, features = ["std", "async"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = "0.4"
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = [
    "parsing",
    "printing",
    "proc-macro",
    "full",
    "extra-traits",
    "clone-impls",
] }
jni = { version = "0.21", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

istmo-core = { path = "crates/core", version = "0.1.1-alpha.7" }
istmo-build = { path = "crates/build", version = "0.1.1-alpha.7" }
istmo-macros = { path = "crates/macros", version = "0.1.1-alpha.7" }
istmo-media = { path = "crates/media", version = "0.1.1-alpha.7" }
istmo-menu = { path = "crates/menu", version = "0.1.1-alpha.7" }
# Default features off: the facade forwards exactly one activity flavor.
istmo-android = { path = "crates/android", version = "0.1.1-alpha.7", default-features = false }
istmo-ios = { path = "crates/ios", version = "0.1.1-alpha.7" }
istmo-plugins = { path = "crates/plugins", version = "0.1.1-alpha.7" }
istmo-plugins-schema = { path = "crates/plugins-schema", version = "0.1.1-alpha.7" }
istmo-window = { path = "crates/window", version = "0.1.1-alpha.7" }

istmo-google-sign-in = { path = "plugins/google-sign-in", version = "0.1.1-alpha.7" }
istmo-data-store = { path = "plugins/data-store", version = "0.1.1-alpha.7" }
istmo-live-activity = { path = "plugins/live-activity", version = "0.1.1-alpha.7" }
istmo-pen = { path = "plugins/istmo-pen", version = "0.1.1-alpha.7" }
istmo-file-picker = { path = "plugins/file-picker", version = "0.1.1-alpha.7" }
istmo-share = { path = "plugins/share", version = "0.1.1-alpha.7" }
istmo-dnd = { path = "plugins/dnd", version = "0.1.1-alpha.7" }
istmo-webview = { path = "plugins/webview", version = "0.1.1-alpha.7" }
istmo-biometric = { path = "plugins/biometric", version = "0.1.1-alpha.7" }
istmo-camera = { path = "plugins/camera", version = "0.1.1-alpha.7" }
istmo-tray = { path = "plugins/tray", version = "0.1.1-alpha.7" }

[package]
name = "istmo"
version = "0.1.1-alpha.7"
description = "Rust ↔ mobile native interop framework — write shared Rust code, ship it to Android + iOS through a typed plugin contract."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mobile", "android", "ios", "ffi", "interop"]
categories = ["development-tools::ffi", "os", "api-bindings"]

[features]
# Forward the activity-flavor selection to `istmo-android`. Consumers
# building the facade for Android pick exactly one. Keep
# `native-activity` as the default so existing demos continue to work
# unchanged; pen-demo opts into `game-activity` explicitly.
default = ["native-activity"]
native-activity = ["istmo-android/native-activity"]
game-activity = ["istmo-android/game-activity"]
# `istmo::plugins::SafeAreaPublisher`: a Rust frame loop publishes the
# key window's safe-area insets itself (iOS / tvOS / visionOS).
winit-publisher = ["istmo-plugins/winit-publisher"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
istmo-plugins = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# The workspace entry has default features off, so the facade features
# pick the activity flavor (see `native-activity` / `game-activity` above).
istmo-android = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
istmo-ios = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
flume = { workspace = true }

# `tests/wasm_runtime.rs` runs under `wasm-bindgen-test-runner`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true

[package.metadata.release]
# Every entry needs `prerelease = true`: cargo-release skips replacements
# on pre-release versions otherwise, and every istmo release is one.
# Docs entries rewrite istmo crate requirements, the runtime and plugin
# coordinates, the Swift package `from:` and the prose quoting the version.
pre-release-replacements = [
    { file = "runtime/android/gradle.properties", search = "^runtimeVersion=.*$", replace = "runtimeVersion={{version}}", prerelease = true },
    { file = "runtime/gradle-plugin/gradle.properties", search = "^pluginVersion=.*$", replace = "pluginVersion={{version}}", prerelease = true },
    { file = "examples/data-store-demo/android/app/build.gradle.kts", search = 'io\.github\.sergioribera:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "io.github.sergioribera:istmo-runtime:{{version}}", prerelease = true },
    { file = "examples/rust-mobile-demo/android/app/build.gradle.kts", search = 'io\.github\.sergioribera:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "io.github.sergioribera:istmo-runtime:{{version}}", prerelease = true },
    { file = "examples/live-activity-demo/android/app/build.gradle.kts", search = 'io\.github\.sergioribera:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "io.github.sergioribera:istmo-runtime:{{version}}", prerelease = true },
    { file = "examples/pen-demo/android/app/build.gradle.kts", search = 'io\.github\.sergioribera:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "io.github.sergioribera:istmo-runtime:{{version}}", prerelease = true },
    { file = "examples/biometric-demo/android/app/build.gradle.kts", search = 'io\.github\.sergioribera:istmo-runtime:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', replace = "io.github.sergioribera:istmo-runtime:{{version}}", prerelease = true },
