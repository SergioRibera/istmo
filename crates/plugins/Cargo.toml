[package]
name = "istmo-plugins"
version = "0.1.1-alpha.2"
description = "First-party istmo plugins: Permissions, AppLifecycle, DeepLinks, ActivityResults, SafeAreaPublisher, Notifications."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["istmo", "plugin", "mobile", "android", "ios"]
categories = ["os", "api-bindings"]

[features]
default = []
winit-publisher = []

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = "0.6"

[build-dependencies]
istmo-build = { workspace = true }
istmo-plugins-schema = { workspace = true }

[dev-dependencies]

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"

