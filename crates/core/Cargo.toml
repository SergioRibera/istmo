[package]
name = "istmo-core"
version = "0.1.1-alpha.6"
description = "Transport, protocol, routing and per-process runtime for the istmo framework."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["mobile", "android", "ios", "ffi", "istmo"]
categories = ["development-tools::ffi", "network-programming", "os"]

[dependencies]
wincode = { workspace = true }
flume = { workspace = true }
oneshot = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }

# The browser has no threads: hosted work runs on its event loop.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]

[lints]
workspace = true

