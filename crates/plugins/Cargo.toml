[package]
name = "istmo-plugins"
version = "0.0.0"
description = "Core plugin surface (Permissions, AppLifecycle, DeepLinks, ActivityResults)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Rust-side publisher for the safe-area plugin: takes a `winit`-owned
# window handle and drives `Runtime::publish_early_latest` directly, so
# consumers do not need a Kotlin / Swift publisher. iOS uses objc2 to
# read `UIWindow.safeAreaInsets`; other targets stay a no-op today.
winit-publisher = ["dep:raw-window-handle"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
bincode = { workspace = true }
flume = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
raw-window-handle = { version = "0.6", optional = true }

# `objc2` refuses to compile off Apple, so scope the dep to iOS-family
# targets. The publisher module's body is gated on the same cfg so
# non-Apple builds with `--features winit-publisher` still succeed with
# a no-op publisher.
[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = "0.6"

# `build.rs` regenerates the `#[message]` type declarations from the
# canonical `Contract` builders in `istmo-plugins-schema`. Both crates
# are build-time only from `istmo-plugins`' perspective — nothing ships
# in the runtime dep tree.
[build-dependencies]
istmo-build = { workspace = true }
istmo-plugins-schema = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
