[package]
name = "istmo-file-picker"
version = "0.1.1-alpha.2"
description = "Cross-platform file-picker plugin for the istmo framework — SAF on Android, UIDocumentPicker on iOS, NSOpenPanel on macOS, IFileOpenDialog on Windows, XDG portal on Linux."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["istmo", "file-picker", "saf", "document-picker", "mobile"]
categories = ["filesystem", "api-bindings"]
links = "istmo_file_picker"

[features]
default = []
codegen = ["dep:istmo-build"]

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
bincode = { workspace = true }
istmo-build = { workspace = true, optional = true }

# Reference desktop backend (Rust-hosted): rfd wraps the native pickers.
# Windows/macOS use native APIs synchronously; Linux uses the XDG
# Desktop Portal, which rfd drives via an internal pollster executor
# (no external async runtime required).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.17", default-features = false }

# Linux: skip rfd's `wayland` default feature (which pulls wayland-sys +
# pkg-config); the XDG portal works on both X11 and Wayland through the
# session DBus service, no direct Wayland link needed.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
flume = { workspace = true }
pollster = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
redundant_pub_crate = "allow"
