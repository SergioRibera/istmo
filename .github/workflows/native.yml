name: native

# Compiles the Kotlin and Swift halves that `cargo test` never sees: the
# runtimes under `runtime/`, the code `istmo-build` generates into apps
# and the `native/` sources of the plugins, built together through the
# examples that link them.
#
# * `swift-core` — type-checks the UIKit-free core of the Swift runtime on
#   Linux against a Foundation stub (`runtime/ios/ci/typecheck-stub.sh`).
#   Fast feedback; the same script runs on a dev box with any swiftc.
#   It also type-checks the generated Swift goldens with warnings as
#   errors (`runtime/ios/ci/typecheck-goldens.sh`).
# * `kotlin-goldens` — compiles the generated Kotlin goldens with `-Werror`
#   on a plain JVM (`runtime/android/ci/compile-goldens.sh`), so a
#   generator change cannot ship warnings into every app. The `packaged_*`
#   goldens are whole files as an app outside `dev.istmo.runtime` gets
#   them (package line and runtime imports included).
# * `ios` — builds the `IstmoRuntime` package for the iOS Simulator and
#   type-checks each example's generated Swift plus its plugins'
#   `native/ios` sources against the real SDK
#   (`runtime/ios/ci/typecheck-app.sh`).
# * `android` — compiles each example's Kotlin (Kotlin runtime as an
#   included build, generated dispatchers / codecs / registry, plugin
#   `native/android` sources) in the same rust-android image the
#   justfile uses. `compileDebugKotlin` stops short of the cargo
#   cross-build and APK signing. `data-store-demo` pins the legacy
#   `android_package = "dev.istmo.runtime"`; the others generate into the
#   default `<namespace>.gen`, so plugin `native/android` sources are
#   compiled against an app package of their own.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "runtime/**"
      - "plugins/*/native/**"
      - "plugins/*/istmo.toml"
      - "crates/build/**"
      - "crates/ios/**"
      - "crates/android/**"
      - "examples/**"
      - "Package.swift"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v7
      - name: Type-check runtime core
        run: runtime/ios/ci/typecheck-stub.sh
      - name: Type-check generated Swift with warnings as errors
        run: runtime/ios/ci/typecheck-goldens.sh

  kotlin-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Matches the Kotlin Gradle plugin the examples apply.
      KOTLIN_VERSION: "1.9.24"
      COROUTINES_VERSION: "1.8.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc and kotlinx-coroutines
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/coroutines.jar" \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/$COROUTINES_VERSION/kotlinx-coroutines-core-jvm-$COROUTINES_VERSION.jar"
      - name: Compile generated Kotlin with warnings as errors
        run: KOTLIN_CLASSPATH="$RUNNER_TEMP/coroutines.jar" runtime/android/ci/compile-goldens.sh

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        example: [data-store-demo, biometric-demo, live-activity-demo]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-${{ matrix.example }}
      - name: Build IstmoRuntime for the iOS Simulator
        # Xcode names the scheme of a multi-target package `<name>-Package`
        # and only adds per-product schemes for some layouts.
        run: |
          schemes=$(xcodebuild -list -json | jq -r '(.workspace // .project).schemes[]')
          echo "$schemes"
          scheme=$(printf '%s\n' "$schemes" | grep -xm1 -e IstmoRuntime -e istmo-Package || true)
          test -n "$scheme"
          xcodebuild build \
            -scheme "$scheme" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
      - name: Type-check ${{ matrix.example }}
        run: runtime/ios/ci/typecheck-app.sh "${{ matrix.example }}"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: sergioribera/rust-android:1.98-sdk-36
    env:
      # Actions sets HOME to /github/home in containers; the image
      # installs rustup and its toolchain under /root.
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
    strategy:
      fail-fast: false
      matrix:
        example: [data-store-demo, biometric-demo, share-demo, camera-demo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /root/.cargo/registry
          key: android-${{ matrix.example }}-${{ hashFiles('**/*.gradle.kts', '**/Cargo.toml') }}
          restore-keys: android-${{ matrix.example }}-
      - name: Compile Kotlin
        working-directory: examples/${{ matrix.example }}/android
        run: gradle :app:compileDebugKotlin --no-daemon
