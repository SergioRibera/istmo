[package]
name = "istmo-drop"
version = "0.1.1-alpha.6"
description = "Files dragged into the app from other apps for the istmo framework: Android and iOS drops as copies the app owns, Wayland drops (Flatpak included) and toolkit drops on desktop."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["istmo", "drag-and-drop", "drop", "mobile", "files"]
categories = ["gui", "api-bindings"]
links = "istmo_drop"

[dependencies]
istmo-core = { workspace = true }
istmo-macros = { workspace = true }
flume = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
istmo-window = { workspace = true }

# Wayland drag and drop on the app's own display, and the document
# portal for drops into a Flatpak sandbox.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
istmo-build = { workspace = true }

[dev-dependencies]
istmo-build = { workspace = true }
pollster = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
istmo-window = { workspace = true }
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "rwh_06"] }

[lints.rust]
# Toolchains older than clippy 1.100 do not know `unused_async_trait_impl`.
unknown_lints = { level = "allow", priority = -2 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
# Only the Wayland backend, which adopts the app's `wl_display`.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
redundant_pub_crate = "allow"
# Plugin traits are async; sync backends implement them with `async fn`
# rather than hand-built `std::future::ready` futures.
unused_async_trait_impl = "allow"
