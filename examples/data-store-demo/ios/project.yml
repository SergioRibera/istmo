# xcodegen spec for the data-store demo (iOS side).
#
# Generate the .xcodeproj with:
#
#   cd examples/data-store-demo/ios && xcodegen generate
#
# The .xcodeproj is not checked into the repo. Regenerating is
# deterministic — the day-to-day flow is `xcodegen generate` once and then
# `xcodebuild` / Xcode against the result.

# `DataStoreDemo/istmo-plugins.yml` is generated by the crate's build.rs (any
# `cargo build` of the crate writes it; run one before the first
# `xcodegen generate`). It brings in the plugin sources, the app identity
# and deployment target from istmo.toml, the Rust library link settings
# and the pre-build phase that runs cargo.

name: DataStoreDemo

include:
  - path: DataStoreDemo/istmo-plugins.yml

options:
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  # SPM does not support subpath references, so the canonical
  # `IstmoRuntime` sources live under `runtime/ios/Sources/IstmoRuntime`
  # in the monorepo, discovered through the root `Package.swift`. The
  # relative path from `examples/data-store-demo/ios/` to the repo root
  # is three directories up. Once `runtime-vX.Y.Z` is tagged, downstream
  # apps swap this entry for `url:` + `from:` version selectors.
  IstmoRuntime:
    path: ../../..

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  DataStoreDemo:
    type: application
    platform: iOS
    sources:
      - path: DataStoreDemo
    info:
      path: DataStoreDemo/Info.plist
    dependencies:
      - package: IstmoRuntime
        product: IstmoRuntime
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
