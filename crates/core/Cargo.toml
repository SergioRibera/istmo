[package]
name = "istmo-core"
version = "0.1.1-alpha.7"
description = "Transport, protocol, routing and per-process runtime for the istmo framework."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["mobile", "android", "ios", "ffi", "istmo"]
categories = ["development-tools::ffi", "network-programming", "os"]

[dependencies]
wincode = { workspace = true }
flume = { workspace = true }
oneshot = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
# `Stream` for `FrameSink`; already in the graph through flume's async
# feature.
futures-core = { version = "0.3", default-features = false }

# Debug builds check that DMA-BUF fds handed to a frame are close-on-exec.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std"] }

# The browser has no threads: hosted work runs on its event loop.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The stream benchmark declares its plugin through the real macros.
istmo-macros = { workspace = true }

[[bench]]
name = "call_overhead"
harness = false

[[bench]]
name = "stream_paths"
harness = false

[lints]
workspace = true

